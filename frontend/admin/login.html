<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Connexion administration — ATO</title>
    <link rel="icon" type="image/jpeg" href="../image/logo.jpeg">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,400..600&family=Inter:wght@400;500;600;700&display=swap" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,400..600&family=Inter:wght@400;500;600;700&display=swap"></noscript>

    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="admin.css">
</head>
<body class="admin-body">

    <div class="login-screen">
        <div class="login-box">

            <div class="login-logo">
                <img src="../image/logo.jpeg" alt="Logo de l'Association des Tchadiens d'Occitanie">
                <span>ATO</span>
            </div>

            <span class="eyebrow centered">Espace administration</span>
            <h1 class="login-title">Connexion</h1>

            <form id="login-form" novalidate>

                <div class="form-group full">
                    <label for="email">Adresse e-mail</label>
                    <input type="email" id="email" name="email" required autocomplete="username">
                </div>

                <div class="form-group full">
                    <label for="motDePasse">Mot de passe</label>
                    <input type="password" id="motDePasse" name="motDePasse" required autocomplete="current-password">
                </div>

                <button type="submit" class="btn-primary form-submit" id="login-submit-btn">Se connecter</button>

                <p class="form-status" id="login-status" role="status" aria-live="polite"></p>

            </form>

            <a href="../index.html" class="back-to-site">← Retour au site</a>

        </div>
    </div>

    <script src="admin-auth.js"></script>
    <script src="login.js"></script>
</body>
</html>
